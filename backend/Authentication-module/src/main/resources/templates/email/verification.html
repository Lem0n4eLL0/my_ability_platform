<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Подтверждение регистрации</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #2c3e50;">🎓 Gigant Verification</h2>

  <p>Здравствуйте!</p>

  <p>Вы зарегистрировались в системе верификации навыков <strong>Gigant</strong>.</p>

  <p>Для завершения регистрации нажмите на кнопку ниже:</p>

  <div style="text-align: center; margin: 30px 0;">
    <p style="text-align: center;">
      <a th:href="${confirmationLink}" class="button"
         style="display: inline-block; padding: 12px 24px; background-color: #4a6fa5; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold;">Подтвердите
        адрес электронной почты</a>
    </p>
  </div>


  <hr style="border: none; border-top: 1px solid #ecf0f1; margin: 30px 0;">

  <p style="font-size: 12px; color: #95a5a6;">
    Если вы не регистрировались в Gigant, просто проигнорируйте это письмо.<br>
    С уважением, команда поддержки.
  </p>
</div>
</body>
</html>
