# application.yml
spring:
  application:
    name: gigant-application
  

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # DataSource
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:skills_verification}
    username: ${POSTGRES_USER:gigant_admin}
    password: ${POSTGRES_PASSWORD:SecureP@ssw0rd_2024!}
    driver-class-name: org.postgresql.Driver
  
  # JPA (опционально, если используешь Hibernate)
  jpa:
    hibernate:
      ddl-auto: validate  # ← Не создаёт таблицы сам, полагается на миграции
    show-sql: true