server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xhtml+xml
        text/xml
        image/svg+xml
        font/ttf
        font/otf;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # SPA-роутинг: если файл не найден, отдаём index.html (обработка на клиенте)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API-запросов на Spring Boot
    location /api/ {
        # ВАЖНО: без слеша в конце сохраняет префикс /api/ в запросе
        # Если контроллеры НЕ ждут /api, добавь слеш: http://backend:8080/
        proxy_pass http://localhost:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Для WebSocket (если используются в проекте)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Healthcheck-эндпоинт для Docker / оркестратора
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Блокировка доступа к скрытым файлам (.env, .git, .htaccess и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}