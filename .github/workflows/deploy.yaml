name: Deploy GigAntApplication

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # 👇 Приводим владельца к нижнему регистру сразу для всего пайплайна
  OWNER_LC: ${{ github.repository_owner | lower }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}  # 👈 Используем твой PAT, а не GITHUB_TOKEN

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            # 👇 Используем OWNER_LC вместо владельца с заглавными
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPO_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}  # 👈 Тоже меняем здесь

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_APP_API_URL=${{ vars.VITE_APP_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPO_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 👇 Здесь тоже используем CR_PAT для логина на сервере
            echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd /opt/gigant
            
            git reset --hard
            git pull origin main
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f --filter "until=24h"