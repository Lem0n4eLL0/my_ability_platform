services:
  # === PostgreSQL ===
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gigant_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'  # ← Для локальной разработки
    ports:
      - "5050:80"  # ← Открываем доступ: http://localhost:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # === Application ===
  backend:
    image: gigant:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      API_DOMAIN: ${API_DOMAIN}
      COMPANY_NAME: ${COMPANY_NAME}
      # Spring Boot properties (прямой маппинг)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy  # ← Ждём готовности БД
      redis:
        condition: service_started
    volumes:
      - keys:/app/keys:ro
    networks:
      - internal
#    ports:
#      - "8080:8080"

  # === Redis (исправлено) ===
  redis:
    image: redis:7-alpine
    container_name: verification_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # ← Исправлено
    restart: unless-stopped
    networks: # ← Добавлено
      - internal          # ← Добавлено
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: gigant_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: # ← Передаём аргументы сборки
        VITE_APP_API_URL: ${VITE_APP_API_URL}
    restart: always
    env_file: .env
    ports:
    - "3000:80"
    networks:
      - internal




networks:
  internal:

volumes:
  pgdata:
  keys:
  redis_data:
  pgadmin_data:  # ← Добавлено
